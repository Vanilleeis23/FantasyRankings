name: Save Board Layout from Webpage

on:
  repository_dispatch:
    types: [save_layout]

permissions:
  contents: write

jobs:
  save-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Save payload to file
        run: |
          cat << 'EOF' > players.json
          ${{ toJson(github.event.client_payload.players_data) }}
          EOF

      - name: Formatiere JSON sauber (optional, verhindert Einzeiler-JSON)
        run: |
          node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('players.json', 'utf8')); fs.writeFileSync('players.json', JSON.stringify(data, null, 4), 'utf8');"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add players.json
          
          # Nur commiten, falls sich strukturell wirklich etwas geändert hat
          if ! git diff --cached --quiet; then
            git commit -m "chore: update players.json layout via web interface [skip ci]"
            git push origin main
          else
            echo "Keine Änderungen festgestellt."
          fi
