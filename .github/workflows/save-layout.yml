name: Save Player Layout

on:
  repository_dispatch:
    types: [save_layout]

permissions:
  contents: write
  actions: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

       Tarjeta data schreiben
      - name: Write payload to players.json
        run: |
          cat << 'EOF' > players.json
          ${{ toJson(github.event.client_payload.players_data) }}
          EOF

      - name: Commit and Push changes
        id: git_push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add players.json
          
          if ! git diff --cached --quiet; then
            git commit -m "Data: Spieler-Layout gespeichert"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Keine Änderungen festgestellt."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  # DIESEN NEUEN JOB HINZUFÜGEN:
  # Er startet automatisch nach dem 'save'-Job und ruft die build-html auf
  trigger-build:
    needs: save
    # Nur ausführen, wenn oben auch wirklich neue Daten gepusht wurden
    if: ${{ needs.save.outputs.changed != 'false' }}
    uses: ./.github/workflows/build-html.yml@main
