name: Save Player Layout

on:
  repository_dispatch:
    types: [save_layout]

permissions:
  contents: write
  actions: write

jobs:
  save:
    runs-on: ubuntu-latest
    # Hier definieren wir den Ausgangswert für den nächsten Job
    outputs:
      changed: ${{ steps.git_push.outputs.changed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Write payload to players.json
        run: |
          cat << 'EOF' > players.json
          ${{ toJson(github.event.client_payload.players_data) }}
          EOF

      - name: Commit and Push changes
        id: git_push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add players.json
          
          if ! git diff --cached --quiet; then
            git commit -m "Data: Spieler-Layout gespeichert"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Keine Änderungen festgestellt."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  trigger-build:
    needs: save
    if: ${{ needs.save.outputs.changed == 'true' }}
    uses: ./.github/workflows/build-html.yml  # <-- Das "@main" wurde hier entfernt!
