name: Deploy Board to GitHub Pages

on:
  push:
    branches:
      - main  # Falls dein Haupt-Branch 'master' heißt, hier abändern
    paths:
      - 'players.json'
      - 'teams.json'
      - 'generate_site.py'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate HTML Site
        run: python generate_html.py

      - name: Commit and Push generated HTML
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          # Nur committen und pushen, falls sich die index.html tatsächlich verändert hat
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated HTML rebuild by GitHub Action" && git push)
